<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Inicio de Sesión</title>
    <script type="module" src="../Public/js/login.js"></script>
    <link rel="stylesheet" href="../Public/css/stylesLogin.css">
    
    <link rel="stylesheet" href="../Public/css/modern-ui.css">
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">Inicio de Sesión</h1>
        
        <div class="logos">
            <img src="../Public/images/logo_municipio.png" alt="San Joaquín Pueblo Mágico" class="logo-left" style="max-width: 200px;">
            <img src="../Public/images/logo-huapango.png" alt="XLIX Concurso Nacional de Baile de Huapango" class="logo-right" style="max-width: 200px;">
        </div>
        
        <div class="login-form-container">
            <div class="user-icon-container">
                <div class="user-icon">👤</div>
            </div>
            
            <form>
                <div class="form-group">
                    <div class="input-icon user-input">
                        <input type="text" class="form-control" placeholder="USUARIO" id="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="input-icon password-input">
                        <input type="password" class="form-control" placeholder="CONTRASEÑA" id="password">
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="show-password">
                    <label for="show-password">Ver contraseña</label> 
                </div>
                <button type="submit" class="login-button" id="loginBtn">Ingresar</button>
                <p id="errorMsg"></p>
            </form>
        </div>
    </div>
    

</body>
</html>
