<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurar conexión</title>
    <script type="module" src="../Public/js/configuracionBD.js"></script>
    <link rel="stylesheet" href="../Public/css/stylesconfigBD.css">
    <link rel="stylesheet" href="../Public/css/modern-ui.css">
</head>
<body>
    <h2>Conexión con la base de datos</h2>
    <p>Completa los datos de MySQL. Comprobaremos la conexión antes de guardarlos.</p>
    <form id="formConfiguracion">
        <fieldset id="camposConfiguracion" disabled>
            <label for="HostBaseDatos">Servidor</label>
            <input id="HostBaseDatos" type="text" value="127.0.0.1" required>
            <label for="PuertoBaseDatos">Puerto</label>
            <input id="PuertoBaseDatos" type="number" value="3306" min="1" max="65535" required>
            <label for="UsuarioBaseDatos">Usuario de MySQL</label>
            <input id="UsuarioBaseDatos" type="text" required autocomplete="off">
            <label for="ContrasenaBaseDatos">Contraseña</label>
            <input id="ContrasenaBaseDatos" type="password" autocomplete="off" aria-describedby="ayudaContrasena">
            <p id="ayudaContrasena">Vuelve a escribirla al cambiar la conexión. Déjala vacía solo si tu usuario no tiene contraseña.</p>
            <label for="database">Nombre de la base de datos</label>
            <input id="database" type="text" required>
            <button id="btnGuardarConfigBaseDatos" type="submit">Comprobar y guardar</button>
        </fieldset>
    </form>
    <p id="estadoConfiguracion" role="status" aria-live="polite">Cargando configuración…</p>
    <button id="btnContinuarConfiguracion" type="button" hidden>Continuar al inicio de sesión</button>
</body>
</html>
