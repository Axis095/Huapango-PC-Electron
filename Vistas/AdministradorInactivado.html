<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="../Public/js/tema.js"></script>
    <script type="module" src="../Public/js/interfaz.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista administrador</title>
    <link rel="stylesheet" href="../Public/css/StylesAdministrador.css">
    <link rel="stylesheet" href="../Public/css/stylesIndex.css">
    <script type="module" src="../Public/js/render.js"></script>
    <link rel="stylesheet" href="../Public/css/avisos.css">
    <link rel="stylesheet" href="../Public/css/modern-ui.css">
</head>
<body>
        <nav class="menu" aria-label="Navegación principal">
        <span class="menu-marca">Huapango</span>
        <div class="menu-links">
            <button id="btnIndex" type="button">Inicio</button>
            <button id="btnRegistros" type="button" hidden disabled>Registro</button>
            <button id="btnBusquedaParejas" type="button" hidden disabled>Buscar y editar</button>
            <button id="btnResultados" type="button" hidden disabled>Evaluaciones</button>
            <button id="btnAdministrador" type="button" hidden disabled>Administración</button>
            <button id="btnSalir" type="button">Salir</button>
        </div>
        <label class="selector-apariencia">Tema<select data-selector-tema aria-label="Apariencia"><option value="sistema">Sistema</option><option value="claro">Claro</option><option value="oscuro">Oscuro</option></select></label>
    </nav>


    <div class="main-container">
        <h1 class="main-title">Vista administrador</h1>
        
        <div class="header">
            <div class="logo">
                <img src="../Public/images/logo-huapango.png" alt="XLIX HUAPANGO">
            </div>
            <div class="perfil-cuenta" role="group" aria-label="Cuenta activa">
                <span class="perfil-cuenta-etiqueta">Cuenta activa</span>
                <span data-nombre-sesion aria-live="polite">Cargando cuenta…</span>
            </div>
        </div>
        
        <div class="content">
            <!-- Seccion de eliminacion de parejas -->
            <div class="section center-content">
                <div class="section-title">Eliminación de parejas</div>
                <div class="form-group">
                    <input id="nParejaID" type="text" class="form-control" placeholder="Ingresar ID de la pareja">
                </div>
                <div class="form-group">
                    <button class="btn">Consultar</button>
                </div>
                <div class="resultados-busqueda" style="display: none;">
                    <p><strong>Nombre:</strong> <span id="nombrePareja"></span></p>
                    <p><strong>Categoría:</strong> <span id="categoriaPareja"></span></p>
                </div>
                <button id="btnEliminarPareja" class="btn btn-secondary">Eliminar pareja</button>
            </div>

            <!-- Seccion de crear/eliminar usuarios -->
            <div id="crear-modificar-usuario" class="section">
                <div class="section-title">Gestión de usuarios</div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h2>Crear nuevo usuario</h2>
                        <div class="form-group">
                            <input id="nuevoID" type="text" class="form-control" placeholder="ID del Usuario">
                        </div>
                        <div class="form-group">
                            <input id="nuevoUsuario" type="text" class="form-control" placeholder="Usuario">
                        </div>
                        <div class="form-group">
                            <input id="nuevaContrasena" type="password" class="form-control" placeholder="Contraseña">
                        </div>
                        <div class="checkbox-container" style="margin-bottom: 15px;">
                            <input type="checkbox" id="esAdmin">
                            <label for="esAdmin">¿Es administrador?</label>
                        </div>
                        <button id="btnCrearUsuario" class="btn btn-add">Crear Usuario</button>
                    </div>
                    
                    <div>
                        <h2>Eliminar usuario</h2>
                        <div class="form-group">
                            <input id="usuarioEliminar" type="text" class="form-control" placeholder="Usuario a eliminar">
                        </div>
                        <button id="btnEliminarUsuario" class="btn btn-secondary">Eliminar Usuario</button>
                    </div>
                </div>
            </div>
            
            <!-- Seccion de crear nuevo juez -->
            <div id="crear-juez" class="section">
                <div class="section-title">Gestión de jueces</div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h2>Crear nuevo juez</h2>
                        <div class="form-group">
                            <input id="nuevoJuezID" type="text" class="form-control" placeholder="Ingresa ID del juez">
                        </div>
                        <div class="form-group">
                            <input id="nuevoJuezUsuario" type="text" class="form-control" placeholder="Usuario">
                        </div>
                        <div class="form-group">
                            <input id="nuevoJuezContrasena" type="password" class="form-control" placeholder="Contraseña">
                        </div>
                        <div class="checkbox-container" style="margin-bottom: 15px;">
                            <input type="checkbox" id="juez">
                            <label for="juez">¿Es juez?</label>
                        </div>

                        <button id="btnCrearJuez" class="btn btn-add">Crear Juez</button>
                    </div>
                    
                    <div>
                        <h2>Eliminar juez</h2>
                        <div class="form-group">
                            <input id="juezEliminar" type="text" class="form-control" placeholder="Juez a eliminar">
                        </div>
                        <button id="btnEliminarJuez" class="btn btn-secondary">Eliminar Juez</button>
                    </div>
                </div>
            </div>
            <div>
                <button id="btnGenerarPDFRegistros" hidden disabled class="btn btn-secondary">Generar PDF datos generales.</button>
            </div>
        </div>
    </div>
</body>
</html>
